name: Tests and Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write  # Needed to create coverage-data branch
  checks: write
  pull-requests: write
  actions: write

jobs:
  test-and-coverage:
    name: Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: make install

      - name: Install Playwright browsers
        run: uv run playwright install chromium

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v -n auto \
            --cov=aviation_anomaly \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=test-results.xml

          # Rename coverage file for artifact upload
          if [ -f .coverage ]; then
            echo "Coverage data file created successfully"
            echo "Coverage summary:"
            uv run coverage report
          else
            echo "Warning: No .coverage file created"
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.xml
            test-results.xml
            htmlcov/
          if-no-files-found: warn
          include-hidden-files: true

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Coverage Comment
        uses: py-cov-action/python-coverage-comment-action@v3
        if: always() && github.event_name == 'pull_request'
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
          ANNOTATE_MISSING_LINES: true
          ANNOTATION_TYPE: warning
          VERBOSE: true
          # Store coverage data on a separate branch
          COVERAGE_DATA_BRANCH: coverage-data
          # Show more files in the PR comment
          MAX_FILES_IN_COMMENT: 30
          # Custom artifact name
          COMMENT_ARTIFACT_NAME: aviation-coverage-report

  # Update coverage badge on main/master push
  coverage-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    needs: test-and-coverage
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Generate coverage badge
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_DATA_BRANCH: coverage-data
          # Just update the badge, no PR comment
          COMMENT_TEMPLATE: ""