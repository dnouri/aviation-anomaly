[project]
name = "aviation-anomaly"
version = "0.1.0"
description = "Aviation anomaly tracker - analyze emergency patterns in flight data"
# readme = "README.md"  # TODO: Add README later
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
    "duckdb>=1.1.0",
    "pydantic>=2.11.9",
    "qck>=0.1.0",
    "requests>=2.31.0",
    "trino>=0.328.0",
]

[project.scripts]
aviation-anomaly = "aviation_anomaly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aviation_anomaly"]
exclude = [
    "tests/",
    "data/",
    "research/",
    "tmp/",
    "*.md",
    "Makefile",
    ".env*",
]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.0",  # For parallel test execution
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "pre-commit>=3.5.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: Integration tests for end-to-end pipeline",
    "unit: Fast unit tests for SQL transformations",
]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true
exclude = ["research*/", "tmp/"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_unimported = false
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
exclude = ["research*/", "tmp/"]
